<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="245" r="160" fill="#2563eb" opacity="0.25" filter="url(#glow)"/>

  <!-- Circuit nodes -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <line x1="120" y1="170" x2="160" y2="190"/>
    <circle cx="120" cy="170" r="4" fill="#38bdf8"/>
    <line x1="392" y1="170" x2="352" y2="190"/>
    <circle cx="392" cy="170" r="4" fill="#38bdf8"/>
    <line x1="90" y1="280" x2="140" y2="280"/>
    <circle cx="90" cy="280" r="4" fill="#38bdf8"/>
    <line x1="422" y1="280" x2="372" y2="280"/>
    <circle cx="422" cy="280" r="4" fill="#38bdf8"/>
  </g>

  <!-- Cryptographic Shield -->
  <path d="M 256 125 L 366 150 C 366 270, 256 385, 256 385 C 256 385, 146 270, 146 150 Z"
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>

  <!-- Shackle -->
  <path d="M 221 215 V 185 A 35 35 0 0 1 291 185 V 215"
        fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="208" y="215" width="96" height="76" rx="14" fill="url(#lockGrad)" stroke="#7dd3fc" stroke-width="3"/>

  <!-- Keyhole -->
  <circle cx="256" cy="246" r="9" fill="#0f172a"/>
  <polygon points="253,246 259,246 261,268 251,268" fill="#0f172a"/>
</svg>